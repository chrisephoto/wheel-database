<!DOCTYPE html>
<html>
  <head>
    <title>Wheel Database</title>
    <link href="css/style.css" rel="stylesheet" type="text/css" media="all" />
    <link href="manifest.json" rel="manifest" type="application/manifest+json" />
    <script src="js/script.js" type="text/javascript"></script>
    <script defer src="https://cloud.umami.is/script.js" data-website-id="19790c20-88f2-4a56-bb88-981b260a49ea"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
  </head>
  <body class="theme-light">
    <header>
      <img id="page-logo" src="icons/icon-192.png" alt="Logo" />
      <h1 id="page-title">Wheel Database</h1>
      <a href="//github.com/chrisephoto/wheel-database" target="_blank">
        <span id="button-code" class="material-symbols-rounded" tooltip="View on Github">code</span>
      </a>
      <span id="button-favorite" class="material-symbols-rounded" tooltip="Favorite Wheels">favorite</span>
      <span id="button-random" class="material-symbols-rounded" tooltip="Random Wheel">shuffle</span>
      <span id="button-theme" class="material-symbols-rounded" tooltip="Change Theme">dark_mode</span>
    </header>
  
    <main>
      <div id="wheel-select">
        <section id="wheel-filters">
          <form id="wheel-filters-form" action="javascript:applyFilter()">
            <label for="input-search">Search</label>
            <input id="input-search" type="search" placeholder="Search"/>
            <label for="input-brand">Brand</label>
            <select id="input-brand">
              <option value="" selected>All Brands</option>
            </select>
            <label for="input-manufacturer">Manufacturer</label>
            <select id="input-manufacturer">
              <option value="" selected>All Manufacturers</option>
              <option value="Unverified">Unverified</option>
            </select>
            <label for="input-style">Style</label>
            <select id="input-style">
              <option value="" selected>All Styles</option>
              <option value="Aero">Aero</option>
              <option value="Dish">Dish</option>
              <option value="Fin">Fin</option>
              <option value="Mesh">Mesh</option>
              <option value="Spiral">Spiral</option>
              <option value="3 Split-Spoke">Split-Spoke, 3</option>
              <option value="4 Split-Spoke">Split-Spoke, 4</option>
              <option value="5 Split-Spoke">Split-Spoke, 5</option>
              <option value="6 Split-Spoke">Split-Spoke, 6</option>
              <option value="7 Split-Spoke">Split-Spoke, 7</option>
              <option value="8 Split-Spoke">Split-Spoke, 8</option>
              <option value="9 Split-Spoke">Split-Spoke, 9</option>
              <option value="10 Split-Spoke">Split-Spoke, 10</option>
              <option value="3 Spoke">Spoke, 3</option>
              <option value="4 Spoke">Spoke, 4</option>
              <option value="5 Spoke">Spoke, 5</option>
              <option value="6 Spoke">Spoke, 6</option>
              <option value="7 Spoke">Spoke, 7</option>
              <option value="8 Spoke">Spoke, 8</option>
              <option value="9 Spoke">Spoke, 9</option>
              <option value="10 Spoke">Spoke, 10</option>
              <option value="11 Spoke">Spoke, 11</option>
              <option value="12 Spoke">Spoke, 12</option>
              <option value="15 Spoke">Spoke, 15</option>
              <option value="16 Spoke">Spoke, 16</option>
            </select>
            <label for="input-construction">Construction</label>
            <select id="input-construction">
              <option value="" selected>All Constructions</option>
              <option value="Unverified">Unverified</option>
              <option value="1 Piece">1 Piece</option>
              <option value="2 Piece">2 Piece</option>
              <option value="3 Piece">3 Piece</option>
              <option value="Cast">Cast</option>
              <option value="Semi Solid Forged">Semi Solid Forged</option>
              <option value="Forged">Forged</option>
              <option value="Welded">Welded</option>
              <option value="Overhead Mount">Overhead Mount</option>
              <option value="Sandwich Mount">Sandwich Mount</option>
              <option value="Underhead Mount">Underhead Mount</option>
            </select>
            <label for="input-favorite">Favorite</label>
            <input id="input-favorite" type="checkbox" />
            <label for="input-diameter">Diameter</label>
            <select id="input-diameter">
              <option value="" selected>All Diameters</option>
              <option value="12">12"</option>
              <option value="13">13"</option>
              <option value="14">14"</option>
              <option value="15">15"</option>
              <option value="16">16"</option>
              <option value="17">17"</option>
              <option value="18">18"</option>
              <option value="19">19"</option>
              <option value="20">20"</option>
            </select>
            <label for="input-pcd">PCD</label>
            <select id="input-pcd">
              <option value="" selected>All PCDs</option>
              <option value="4x100">4x100</option>
              <option value="4x114.3">4x114.3</option>
              <option value="5x100">5x100</option>
              <option value="5x108">5x108</option>
              <option value="5x112">5x112</option>
              <option value="5x114.3">5x114.3</option>
              <option value="5x120">5x120</option>
              <option value="5x120.65">5x120.65</option>
              <option value="5x130">5x130</option>
              <option value="5x139.7">5x139.7</option>
              <option value="5x150">5x150</option>
              <option value="6x139.7">6x139.7</option>
            </select>
            <input type="reset" value="Clear" onclick="resetFilter()"/>
            <input type="button" value="Search" onclick="applyFilter()"/>
          </form>
        </section>
        <section id="wheel-list" class="grid">
          <div></div>
          <footer>
            <div id="display-count"></div>
          </footer>
        </section>
      </div>
      <section id="wheel-details">
        <span id="wheel-id" class="hidden"></span>
        <div id="wheel-details-container">
          <div id="wheel-details-close">
            <span class="material-symbols-rounded">close</span>
          </div>
          <div id="wheel-details-header">
            <div id="wheel-details-hero"></div>
            <div id="wheel-images"></div>
          </div>
          <div id="wheel-details-info">
            <div id="wheel-details-text">
              <h1 id="wheel-header-brand"></h1>
              <h2 id="wheel-header-model"></h2>
              <div id="wheel-header-favorite"></div>
              <div id="wheel-header-tags"></div>
              <p id="wheel-header-description"></p>
            </div>
            <table id="wheel-info">
              <caption>Information</caption>
              <tbody>
                <tr>
                  <th>Brand</th>
                  <td id="wheel-info-brand">N/A</td>
                </tr>
                <tr>
                  <th>Model</th>
                  <td id="wheel-info-model">N/A</td>
                </tr>
                <tr>
                  <th>Manufacturer</th>
                  <td id="wheel-info-manufacturer">N/A</td>
                </tr>
                <tr>
                  <th>Production Years</th>
                  <td id="wheel-info-years">N/A</td>
                </tr>
                <tr>
                  <th>Country of Origin</th>
                  <td id="wheel-info-origin">N/A</td>
                </tr>
                <tr>
                  <th>Construction</th>
                  <td id="wheel-info-construction">N/A</td>
                </tr>
                <!--
                <tr>
                  <th>Style</th>
                  <td id="wheel-info-style">N/A</td>
                </tr>
                -->
                <tr>
                  <th>Colors</th>
                  <td id="wheel-info-colors">N/A</td>
                </tr>
                <!--
                <tr>
                  <th>Additional Information</th>
                  <td id="wheel-info-link"><a href="#" target="_blank">Link</a></td>
                </tr>
                -->
              </tbody>
            </table>
            <h2 id="wheel-specs-title">Specifications</h2>
            <div id="wheel-specs-container">
              <table id="wheel-specs">
                <tbody>
                  <tr>
                    <th>Diameter</th>
                    <th>Width</th>
                    <th>PCD</th>
                    <th>Offset(s)</th>
                    <!--<th>Color(s)</th>-->
                  </tr>
                </tbody>
              </table>
            </div>
            <div id="wheel-links-container">
              <h2>Additional Resources</h2>
              <div id="wheel-links"></div>
            </div>
            <div id="wheel-related-container">
              <h2>Related Wheels</h2>
              <div id="wheel-related"></div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
